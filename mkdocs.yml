site_name: Budget Tracker
site_description: Personal finance tracking app — documentation
site_url: https://eengel821.github.io/budget_tracker/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting Started:
    - Setup & Installation: setup.md
    - Importing Transactions: importing.md
  - Using the App:
    - Review Queue: review.md
    - Budget Page: budget.md
    - Savings: savings.md
    - Transactions: transactions.md
    - Categories: categories.md
  - Configuration:
    - Keywords & Categories: keywords.md
    - Backup & Restore: backup.md
  - Reference:
    - Categorization Algorithm: categorization.md
    - Development Notes: development.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
